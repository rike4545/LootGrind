name: Refresh Magic card prices
on:
  workflow_dispatch:
  schedule:
    - cron: "35 12 * * *"

permissions:
  contents: write

concurrency:
  group: magic-card-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate API secret
        run: |
          if [ -z "$TCG_API_KEY" ]; then
            echo "::error::Missing TCG_API_KEY repository secret. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh card price snapshot
        run: python scripts/refresh-magic-card-prices.py

      - name: Publish snapshot to website
        run: |
          cp artifacts/magic-card-prices.json data/magic-card-prices.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/magic-card-prices.json
          if git diff --cached --quiet; then
            echo "No Magic card price changes to publish."
          else
            git commit -m "chore: refresh Magic card prices"
            git push
          fi
