name: Refresh authorized trade-in quotes

on:
  workflow_dispatch:
  schedule:
    # Daily check; quote collection runs only after an authorized feed is configured.
    - cron: "20 12 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRADE_IN_FEED_URL: ${{ secrets.TRADE_IN_FEED_URL }}
      TRADE_IN_FEED_KEY: ${{ secrets.TRADE_IN_FEED_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Explain missing authorized feed
        if: ${{ !env.TRADE_IN_FEED_URL || !env.TRADE_IN_FEED_KEY }}
        run: |
          echo "::notice title=Trade-in feed not configured::No authorized trade-in feed credentials are configured. No retailer pages were scraped and no live quote data was collected."
          echo "To enable automated quote collection, add TRADE_IN_FEED_URL and TRADE_IN_FEED_KEY repository secrets for a provider you are authorized to use."

      - name: Set up Python
        if: ${{ env.TRADE_IN_FEED_URL && env.TRADE_IN_FEED_KEY }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh quotes from authorized feed
        if: ${{ env.TRADE_IN_FEED_URL && env.TRADE_IN_FEED_KEY }}
        env:
          TRADE_IN_FEED_URL: ${{ env.TRADE_IN_FEED_URL }}
          TRADE_IN_FEED_KEY: ${{ env.TRADE_IN_FEED_KEY }}
        run: python scripts/refresh-authorized-tradeins.py

      - name: Publish quote snapshot to website data
        if: ${{ success() && env.TRADE_IN_FEED_URL && env.TRADE_IN_FEED_KEY }}
        run: |
          cp artifacts/trade-in-quotes.json data/trade-in-quotes.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trade-in-quotes.json
          if git diff --cached --quiet; then
            echo "No quote snapshot changes to publish."
          else
            git commit -m "chore: refresh authorized trade-in quotes"
            git push
          fi

      - name: Upload quote snapshot
        if: ${{ success() && env.TRADE_IN_FEED_URL && env.TRADE_IN_FEED_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: lootgrind-trade-in-quotes
          path: artifacts/trade-in-quotes.json
          if-no-files-found: error
          retention-days: 14
